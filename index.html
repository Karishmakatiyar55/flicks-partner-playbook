<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Flicks Partner Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: dashboard with a side rail. Each page leads with a visual (mind map, flow, radial map),
   text kept to short labels. Flam slide look: warm near-black, rose-beige headings, charcoal dot-grid cards, olive pills. */
:root{
  color-scheme:dark;
  --bg:#0a0706; --card:#121010; --card-2:#0d0b0a; --card-3:#171312;
  --line:rgba(255,236,226,.08); --line-2:rgba(255,236,226,.15); --line-3:rgba(255,236,226,.24);
  --ink:#f4ece6; --muted:#a3958e; --faint:#6f625c;
  --rose-1:#f4dbd1; --rose-2:#d9a594; --rose-3:#c48572;
  --accent:#ffd1c2; --accent-ink:#1a0f0b;
  --cream:#eee2d3; --taupe:#8a7c75; --deep:#df7f6b;
  --font:"Inter","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg);scroll-behavior:smooth}
body{
  background:
    radial-gradient(55% 40% at 8% 0%, rgba(92,40,28,.5), transparent 72%),
    radial-gradient(45% 45% at 100% 100%, rgba(84,40,26,.38), transparent 70%),
    linear-gradient(180deg,#120a08 0%, var(--bg) 40%);
  color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;min-height:100vh;
}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance;letter-spacing:-.02em;line-height:1.12}
p{margin:0}
a{color:var(--rose-1)}
button{font:inherit;color:inherit}
.rose{background:linear-gradient(180deg,var(--rose-1) 0%,var(--rose-2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
svg.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes flow{from{left:0}to{left:100%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,165,148,.35)}70%{box-shadow:0 0 0 18px rgba(217,165,148,0)}100%{box-shadow:0 0 0 0 rgba(217,165,148,0)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim{animation:rise .7s var(--ease) both;animation-delay:var(--d,0ms)}
.drawpath{stroke-dasharray:1;animation:draw 1.1s var(--ease) both;animation-delay:var(--d,0ms)}
@media (prefers-reduced-motion:reduce){
  .anim,.drawpath,.rnode,.dot,.rcenter,.loader,.pulse,svg.mind .nd,.tl::before{animation:none!important}
  *{transition:none!important}
}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:26px 16px;border-right:1px solid var(--line);background:rgba(10,8,7,.7);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:26px}
.brand{display:flex;flex-direction:column;gap:10px;padding:0 10px}
.brand img{height:30px;width:auto;align-self:flex-start;filter:brightness(0) invert(1);opacity:.94}
.brand span{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.navwrap{position:relative;display:flex;flex-direction:column;gap:20px}
.navgroup{display:flex;flex-direction:column;gap:3px}
.navgroup h4{margin:0 0 6px;padding:0 12px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.ind{position:absolute;left:0;top:0;width:0;height:0;border-radius:12px;background:rgba(255,236,226,.07);box-shadow:inset 0 0 0 1px var(--line-2),inset 3px 0 0 var(--accent);
  transition:transform .45s var(--ease),width .45s var(--ease),height .45s var(--ease);pointer-events:none}
.nav{position:relative;display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:14px;transition:color .2s}
.nav:hover{color:var(--ink)}
.nav[aria-current="page"]{color:var(--ink)}
.nav .mono{width:26px;height:26px;border-radius:8px;font-size:10.5px}
.nav .mono svg.i{width:14px;height:14px}
.nav .sd{margin-left:auto;width:6px;height:6px;border-radius:50%}
.nav:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{min-width:0;padding:44px 40px 120px}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0;max-width:100vw;position:sticky;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:12px;z-index:20;border-right:0;border-bottom:1px solid var(--line)}
  .brand{flex:0 0 auto;padding:0}.brand span{display:none}.brand img{height:22px}
  .navwrap{flex-direction:row;gap:6px}
  .navgroup{flex-direction:row;gap:3px}.navgroup h4{display:none}
  .nav{white-space:nowrap;padding:6px 10px}.nav .sd{display:none}
  .ind{box-shadow:inset 0 0 0 1px var(--line-2),inset 0 -2px 0 var(--accent)}
  main{padding:28px 16px 120px}
}

/* ---------- atoms ---------- */
.mono{display:inline-grid;place-items:center;flex:0 0 auto;width:44px;height:44px;border-radius:13px;font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--rose-1);
  background:radial-gradient(120% 90% at 30% 0%,rgba(255,226,212,.16),transparent 60%),linear-gradient(180deg,#1d1817,#110e0d);
  box-shadow:inset 0 0 0 1px rgba(255,236,226,.13),inset 0 1px 0 rgba(255,255,255,.07),0 8px 18px rgba(0,0,0,.35)}
.mono.lg{width:72px;height:72px;border-radius:20px;font-size:22px}
.mono.lg svg.i{width:30px;height:30px}
.mono.logo{background:linear-gradient(180deg,#fbf6f2,#efe6df);padding:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 8px 18px rgba(0,0,0,.35)}
.mono.logo img{width:100%;height:100%;object-fit:contain;display:block}
.mono.logo.cover{padding:0!important;background:#000;overflow:hidden}
.mono.logo.cover img{object-fit:cover}
.mono.logo.lg{padding:12px}
.nav .mono.logo{padding:3px}
.mono.k{color:var(--accent)} .mono.c{color:var(--cream)} .mono.t{color:var(--taupe)}
.pulse{animation:pulse 2.6s ease-out 1s infinite}
.tile{display:inline-grid;place-items:center;flex:0 0 auto;width:42px;height:42px;border-radius:12px;color:var(--rose-1);
  background:radial-gradient(120% 90% at 30% 0%,rgba(255,226,212,.14),transparent 60%),linear-gradient(180deg,#1b1716,#110e0d);
  box-shadow:inset 0 0 0 1px rgba(255,236,226,.11),inset 0 1px 0 rgba(255,255,255,.06),0 6px 16px rgba(0,0,0,.3)}
.tile.sm{width:34px;height:34px;border-radius:10px}.tile.sm svg.i{width:17px;height:17px}
.tile.k{color:var(--accent)} .tile.c{color:var(--cream)} .tile.t{color:var(--taupe)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:4px 11px;white-space:nowrap}
.st-built{background:var(--accent);color:var(--accent-ink)}
.st-draft{color:var(--rose-1);box-shadow:inset 0 0 0 1px rgba(217,165,148,.6)}
.st-explore{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2)}
.sd.st-built{background:var(--accent)} .sd.st-draft{background:var(--rose-2)} .sd.st-explore{background:var(--taupe)}
.duo{display:inline-flex;align-items:center;gap:7px;padding:3px 3px 3px 11px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);background:rgba(12,10,9,.7);font-size:12px;color:var(--ink);white-space:nowrap}
.duo svg.i{width:14px;height:14px;color:var(--rose-2)}
.duo b{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:999px;padding:1px 9px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);background:rgba(255,236,226,.06);border:0;border-radius:999px;padding:9px 16px;
  box-shadow:inset 0 0 0 1px var(--line-2);cursor:pointer;text-decoration:none;transition:background .2s,transform .2s var(--ease),box-shadow .2s}
.btn:hover{background:rgba(255,236,226,.11);transform:translateY(-1px)}
.btn svg.i{width:16px;height:16px}
.btn.primary{background:linear-gradient(90deg,#fff,#ffd1c2);color:var(--accent-ink);box-shadow:0 8px 24px rgba(255,209,194,.16),inset 0 1px 0 rgba(255,255,255,.6);font-weight:600}
.btn.primary:hover{background:linear-gradient(90deg,#fff,#ffe2d8);box-shadow:0 10px 30px rgba(255,209,194,.28),inset 0 1px 0 rgba(255,255,255,.7)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:12.5px}
.iconbtn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;border:0;background:rgba(255,236,226,.06);color:var(--muted);cursor:pointer;transition:background .2s,color .2s;flex:0 0 auto}
.iconbtn:hover{background:rgba(223,127,107,.18);color:var(--deep)}
.iconbtn svg.i{width:14px;height:14px}
input:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- page header ---------- */
.phead{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;padding:6px 0 4px}
@media (max-width:760px){.phead{grid-template-columns:1fr}}
.phead .left{display:flex;flex-direction:column;gap:16px}
.phead .idrow{display:flex;align-items:center;gap:18px}
.eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.phead h1{font-size:clamp(34px,5vw,56px)}
.phead .lede{font-size:18px;max-width:52ch;color:var(--ink);opacity:.88}
.stats{display:grid;grid-template-columns:repeat(4,minmax(min(110px,100%),1fr));gap:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border-radius:18px;padding:16px 18px;background:rgba(18,16,16,.8);box-shadow:inset 0 0 0 1px var(--line-2);display:flex;flex-direction:column;gap:2px}
.stat b{font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.qf{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.qf .stat{min-width:120px}

/* ---------- cards ---------- */
.card{position:relative;border-radius:26px;padding:34px;display:flex;flex-direction:column;gap:24px;
  background-color:var(--card);background-image:radial-gradient(rgba(255,236,226,.06) 1px,transparent 1.3px);background-size:18px 18px;
  box-shadow:inset 0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.32)}
@media (max-width:600px){.card{padding:22px;border-radius:22px}}
.card .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.card .hd .t{display:flex;flex-direction:column;gap:10px}
.card h2{font-size:clamp(23px,2.8vw,30px)}
.step{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.step em{font-style:normal;font-weight:600;font-size:11.5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 9px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:18px}
.panel{position:relative;background:var(--card-2);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 1px var(--line-2);
  transition:transform .3s var(--ease),box-shadow .3s}
.panel.lift:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--line-3),0 18px 40px rgba(0,0,0,.35)}
.panel h3{font-size:17px;letter-spacing:-.01em}
.panel.hl{box-shadow:inset 0 0 0 1px rgba(255,209,194,.55)}
.panel .row{display:flex;align-items:center;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:14px}
.fact{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2);font-size:14.5px;
  transition:transform .3s var(--ease),box-shadow .3s}
.fact:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px var(--line-3)}
.big{font-size:36px;font-weight:500;letter-spacing:-.03em;line-height:1.1}

/* ---------- overview mind map ---------- */
.mapwrap{overflow-x:auto;margin:0 -8px;padding:0 8px}
.mind .spark{pointer-events:none}
svg.mind{width:100%;min-width:760px;height:auto;display:block}
svg.mind text{font-family:var(--font);fill:var(--ink)}
svg.mind .lk{fill:none;stroke:rgba(214,170,150,.32);stroke-width:1.4;transition:stroke .25s,stroke-width .25s}
svg.mind .lk.dash{stroke-dasharray:4 5;stroke:rgba(255,209,194,.35)}
svg.mind .lk.on{stroke:var(--rose-1);stroke-width:2.2}
svg.mind .lk.dash.on{stroke:var(--accent)}
svg.mind .nd{animation:rise .7s var(--ease) both;animation-delay:var(--d,0ms)}
svg.mind .nd rect.box{fill:#141110;stroke:rgba(255,236,226,.16);transition:stroke .25s,fill .25s}
svg.mind .leaf{cursor:pointer}
svg.mind .leaf:hover rect.box,svg.mind .leaf:focus rect.box{stroke:var(--rose-2);fill:#1b1615}
svg.mind .leaf:focus{outline:none}
svg.mind .mt{font-size:12px;font-weight:600;fill:var(--rose-1)}
svg.mind .sub{font-size:11.5px;fill:var(--muted)}
svg.mind .core rect.box{fill:url(#coreg);stroke:rgba(244,219,209,.5)}
svg.mind .model rect.box{stroke:rgba(255,209,194,.5)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:16px}
.pcard{position:relative;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:20px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2);
  color:var(--ink);text-decoration:none;transition:transform .35s var(--ease),box-shadow .35s;overflow:hidden}
.pcard::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(70% 60% at 0% 0%,rgba(217,165,148,.12),transparent 70%);opacity:0;transition:opacity .35s;pointer-events:none}
.pcard:hover{transform:translateY(-5px);box-shadow:inset 0 0 0 1px var(--line-3),0 22px 44px rgba(0,0,0,.4)}
.pcard:hover::after{opacity:1}
.pcard .top{display:flex;align-items:center;gap:12px}
.dmini{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:rgba(255,236,226,.03);box-shadow:inset 0 0 0 1px var(--line)}
.dnote{margin:0;font-size:13px;line-height:1.45;color:var(--cream);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drow{display:flex;align-items:center;gap:10px}
.dlab{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dlab .i{width:13px;height:13px}
.dbar{display:flex;gap:4px;flex:1}
.dbar i{flex:1;height:4px;border-radius:4px;background:rgba(255,236,226,.1);transition:background .4s}
.s0 .dbar i.on{background:var(--taupe)} .s1 .dbar i.on,.s2 .dbar i.on{background:var(--rose-2)} .s3 .dbar i.on{background:var(--accent)}
.s1 .dlab,.s2 .dlab{color:var(--rose-1)} .s3 .dlab{color:var(--accent)}
.deal{display:flex;flex-direction:column;gap:16px}
.fh{margin:14px 0 0;font-size:16px;font-weight:500;color:var(--cream)}
.fstepn{align-self:flex-start;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ftable{width:100%;border-collapse:collapse;font-size:14px;min-width:680px}
.ftable th{text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);padding:0 14px 10px 0;border-bottom:1px solid var(--line-2)}
.ftable td{padding:12px 14px 12px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--muted);line-height:1.45}
.ftable td b{font-weight:500;color:var(--ink);white-space:nowrap}
.ftable td:last-child{color:var(--cream)}
.ftable .fdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;vertical-align:1px;background:var(--accent)}
.ftable .k2 .fdot{background:var(--rose-2)} .ftable .k0 .fdot{background:var(--faint)} .ftable .k0 td:last-child{color:var(--faint)}
.finv{display:flex;flex-wrap:wrap;gap:6px}
.finv button{border:0;border-radius:999px;padding:7px 12px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;transition:all .25s}
.finv button:hover{color:var(--ink)}
.finv button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none;font-weight:600}
.funnel{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}
.fst{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:10px;padding:12px 18px;border-radius:14px;background:linear-gradient(90deg,rgba(255,209,194,.16),rgba(255,209,194,.05));box-shadow:inset 0 0 0 1px var(--line-2);transition:width .4s var(--ease),opacity .3s}
.fst.a{width:100%} .fst.b{width:84%} .fst.c{width:68%}
.fst b{font-size:20px;font-weight:500}
.fst span{font-size:13px;color:var(--muted)}
.fst em{font-style:normal;font-size:13px;color:var(--cream)}
.fst.off{opacity:.4}
@media(max-width:640px){.fst.b,.fst.c{width:100%}.fst{grid-template-columns:auto 1fr}.fst em{grid-column:1/-1}}
#brandbox,.brows{display:flex;flex-direction:column;gap:10px}
#brandbox{gap:16px}
.brow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:14px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.brow{padding-left:12px}
.blogo{flex:none;width:34px;height:34px;border-radius:10px;object-fit:contain;background:#f5eee8;padding:4px;box-shadow:inset 0 0 0 1px var(--line-2)}
.blogo.mono{display:grid;place-items:center;padding:0;background:#1d1817;color:var(--rose-1);font-size:14px;font-weight:500}
.bname{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.bname b{font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bname a{font-size:12px;color:var(--faint);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bname a:hover{color:var(--rose-1)}
.brow.s3{box-shadow:inset 0 0 0 1px rgba(255,209,194,.55)}
.bsteps{display:flex;gap:4px;padding:3px;border-radius:999px;background:#0a0807;box-shadow:inset 0 0 0 1px var(--line)}
.bsteps button{border:0;background:transparent;color:var(--faint);font:inherit;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s}
.bsteps button:hover{color:var(--ink)}
.bsteps button.done{color:var(--rose-1)}
.bsteps button.cur{background:linear-gradient(180deg,var(--rose-1),var(--rose-2));color:#2a1d18}
.s3 .bsteps button.cur{background:var(--accent);color:var(--accent-ink)}
.bform{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) auto;gap:8px;align-items:center}
.bform.wide{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) minmax(0,.8fr) auto}
.bform input,.bform select{min-width:0;border:0;border-radius:12px;padding:11px 14px;background:rgba(255,236,226,.04);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink);font:inherit;font-size:14px}
.bform select option{background:#16110f;color:#f4dbd1}
.bform input:focus,.bform select:focus{outline:none;box-shadow:inset 0 0 0 1px var(--accent)}
.bform .err{grid-column:1/-1;margin:0;font-size:12.5px;color:var(--deep)}
.bform .err:empty{display:none}
.bnone{margin:0}
.bhead{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;margin-right:auto}
.bhead b{font-weight:500;font-size:16px}

.dlist{display:flex;flex-direction:column;gap:8px}
.ditem{display:flex;align-items:center;gap:8px}
.dpick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 14px 11px 11px;border:0;border-radius:16px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink);font:inherit;font-size:15px;text-align:left;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,background .25s}
.dpick:hover{transform:translateX(3px);box-shadow:inset 0 0 0 1px var(--line-3)}
.dnum{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:rgba(255,236,226,.06);color:var(--muted);font-size:12.5px}
.dlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dgo,.dnow{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.dgo .i{width:13px;height:13px}
.dpick:hover .dgo{color:var(--rose-1)}
.ditem.on .dpick{background:linear-gradient(180deg,rgba(255,209,194,.16),rgba(255,209,194,.05)),var(--card-2);box-shadow:inset 0 0 0 1px var(--accent),0 12px 28px rgba(0,0,0,.35)}
.ditem.on .dpick:hover{transform:none}
.ditem.on .dnum{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ditem.on .dlabel{font-weight:500}
.dnow{color:var(--accent)}
.dnow i{width:3px;height:12px;border-radius:2px;background:var(--accent);transform-origin:bottom;animation:deq 1s ease-in-out infinite}
.dnow i:nth-child(2){animation-delay:.2s;margin-left:-3px}.dnow i:nth-child(3){animation-delay:.4s;margin-left:-3px;margin-right:2px}
@keyframes deq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.dnow i{animation:none}}
.dedbtn svg.i{width:13px;height:13px}
.dedbtn:hover{background:rgba(255,209,194,.16);color:var(--accent)}
.dedit{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.6fr);gap:8px;align-items:center;padding:10px;border-radius:16px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--accent)}
.dedit input{min-width:0;border:0;border-radius:10px;padding:9px 12px;background:#0a0807;color:var(--ink);font:inherit;font-size:13.5px;box-shadow:inset 0 0 0 1px var(--line-2)}
.dedit input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--accent)}
.dedit .btn{grid-row:2}.dedit .btn.primary{grid-column:2;justify-self:start}.dedit .btn:not(.primary){grid-column:3;justify-self:start}
.dedit .err{grid-column:1/-1;font-size:12.5px;color:var(--deep)}
.dedit .err:empty{display:none}
@media(max-width:560px){.dedit{grid-template-columns:auto minmax(0,1fr)}.dedit input[name=url]{grid-column:1/-1}.dedit .btn{grid-row:auto}.dedit .btn.primary{grid-column:1/span 2}.dedit .btn:not(.primary){grid-column:1/span 2}}
.dadd{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:1px dashed var(--line-2)}
.dlab2{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dlab2 .i{width:13px;height:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabw{display:inline-flex;align-items:center;gap:4px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:0;cursor:pointer;background:rgba(255,236,226,.05);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted);font-size:13.5px;transition:all .25s}
.tab svg.i{width:15px;height:15px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none;font-weight:600}
.seg{display:inline-flex;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);gap:3px}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px;background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer;transition:all .25s}
.seg button svg.i{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#1a1312}
.dform{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:center;padding:12px;border-radius:16px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2)}
@media (max-width:640px){.dform{grid-template-columns:1fr}}
.dform input{min-width:0;border:0;border-radius:10px;padding:9px 12px;background:#0a0807;color:var(--ink);font:inherit;font-size:13.5px;box-shadow:inset 0 0 0 1px var(--line-2)}
.dform input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--accent)}
.dform .err{grid-column:1/-1;font-size:12.5px;color:var(--deep)}
.dform .err:empty{display:none}
.sharednote{display:flex;align-items:center;gap:8px;color:var(--accent)}
.sharednote svg.i{width:16px;height:16px}
.empty{width:300px;max-width:100%;height:260px;border-radius:28px;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:13.5px;
  background:repeating-linear-gradient(135deg,rgba(255,236,226,.03) 0 10px,transparent 10px 20px);box-shadow:inset 0 0 0 1px var(--line-2)}
.empty .tile{margin:0 auto 12px}
.hubrow{display:grid;grid-template-columns:minmax(180px,240px) 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.hubrow:last-child{border-bottom:0}
@media (max-width:700px){.hubrow{grid-template-columns:1fr}}
.hubrow .who{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.dchip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(255,209,194,.1);box-shadow:inset 0 0 0 1px rgba(255,209,194,.4);color:var(--cream);font-size:13px;text-decoration:none;transition:background .2s}
.dchip:hover{background:rgba(255,209,194,.2)}
.dchip svg.i{width:14px;height:14px;color:var(--accent)}
.pending{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted);font-size:13px}
.pending svg.i{width:14px;height:14px}

/* ---------- flows / timeline ---------- */
.lane{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.lane .stp{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:14px;background:var(--card-3);box-shadow:inset 0 0 0 1px var(--line-2);font-size:13.5px}
.lane .ar{color:var(--faint);display:inline-flex}
.lane .ar svg.i{width:16px;height:16px}
.tl{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-top:64px}
.tl::before{content:"";position:absolute;left:12%;right:12%;top:21px;height:2px;background:linear-gradient(90deg,var(--accent),var(--rose-2));transform-origin:left;animation:grow 1.4s var(--ease) both}
.tl .ph{position:relative;display:flex;flex-direction:column}
.tl .ph>.tile{position:absolute;top:-64px;left:50%;transform:translateX(-50%)}
.tl .wk{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:860px){.tl{grid-template-columns:1fr 1fr;padding-top:0}.tl::before{display:none}.tl .ph>.tile{position:static;transform:none;margin-bottom:10px}}
@media (max-width:520px){.tl{grid-template-columns:1fr}}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mini li{display:flex;align-items:flex-start;gap:10px;font-size:14px}
.mini li>svg.i{width:16px;height:16px;margin-top:2px;color:var(--rose-2)}
.mini.k li>svg.i{color:var(--accent)} .mini.t li>svg.i{color:var(--taupe)} .mini.c li>svg.i{color:var(--cream)}
.mini li .iconbtn{margin-left:auto}
.srcs{display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.srcs a{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none}
.srcs a:hover{color:var(--rose-1)}
.srcs svg.i{width:14px;height:14px}
.cluster{display:grid;grid-template-columns:1fr auto 1fr;gap:28px;align-items:center}
@media (max-width:860px){.cluster{grid-template-columns:1fr}}
.cluster .hubc{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.colhead{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.compgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
.comp{display:flex;flex-direction:column;gap:14px;padding:22px}
.comph{display:flex;align-items:center;gap:12px}
.comph>div{flex:1}
.bcount{display:flex;flex-direction:column;align-items:flex-end;font-size:26px;line-height:1;background:linear-gradient(180deg,var(--ink),var(--rose-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bcount small{font-size:11px;color:var(--faint);-webkit-text-fill-color:var(--faint);margin-top:4px}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--cream);background:rgba(255,236,226,.05);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .2s,transform .2s}
.bchip:hover{background:rgba(255,236,226,.1);transform:translateY(-1px)}
.bchip.sh{color:var(--accent-ink);background:var(--accent);box-shadow:none}
.srcl{display:block;margin-top:auto;font-size:12px;line-height:1.5;color:var(--faint)}
.srcl .i{width:13px;height:13px;vertical-align:-2px;margin-right:6px}
.srcl a{color:var(--muted)}
.srcs .srcnote{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}

/* ---------- edit mode ---------- */
.ed{border-radius:6px;transition:background .2s,box-shadow .2s;outline:none}
body.editing .ed{box-shadow:0 0 0 1px rgba(255,209,194,.4);background:rgba(255,209,194,.05);cursor:text}
body.editing .ed:hover{background:rgba(255,209,194,.1)}
body.editing .ed:focus{box-shadow:0 0 0 2px var(--accent);background:rgba(255,209,194,.08)}
body.editing .rose .ed{-webkit-text-fill-color:var(--rose-1)}
.edonly{display:none!important}
body.editing .edonly{display:inline-flex!important}
body.editing .edonly.iconbtn{display:inline-grid!important}
.delx{position:absolute;top:8px;right:8px;z-index:3}
.addbtn{align-self:flex-start;align-items:center;gap:8px;padding:9px 15px;border-radius:14px;border:1px dashed rgba(255,209,194,.5);background:transparent;color:var(--accent);font-size:13px;cursor:pointer}
.addbtn:hover{background:rgba(255,209,194,.08)}
.addbtn svg.i{width:15px;height:15px}
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px var(--line-2),0 20px 50px rgba(0,0,0,.55)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;z-index:60;padding:10px 18px;border-radius:999px;background:var(--ink);color:#1a1312;font-size:13.5px;font-weight:500;
  transition:opacity .3s,transform .4s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:rgba(5,3,3,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal[hidden]{display:none}
.modal .box{width:min(680px,100%);display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2)}
.modal textarea{width:100%;height:300px;border:0;border-radius:12px;padding:12px;background:#0a0807;color:var(--ink);font:12.5px/1.5 ui-monospace,Menlo,monospace;box-shadow:inset 0 0 0 1px var(--line-2);resize:vertical}
</style>

  function addCase(f){

  function wireC(pid){
    var P=byId(pid), DEF={}; for(var k0 in C_DEFAULTS) DEF[k0]=C_DEFAULTS[k0]; if(P.cDef) for(var k1 in P.cDef) DEF[k1]=P.cDef[k1];
    var IDS=["norm","swap","eps","views","sr","sfee","build","vfee","fs"], KEY="flicks-playbook-c1-"+pid, dv={}; for(var k in DEF) dv[k]=DEF[k];
    try{var saved=JSON.parse(localStorage.getItem(KEY)||"null"); if(saved) for(var s2 in saved) dv[s2]=saved[s2];}catch(e){}
    IDS.forEach(function(id){$("c-"+id).value=dv[id]});
    var V=function(id){return FlamFields.val("c-"+id)};
    var money=function(v){var a=Math.abs(v),sg=v<0?"−":"";
      if(a>=1e7) return sg+"₹"+(Math.round(a/1e5)/100).toLocaleString("en-IN")+" crore";
      if(a>=1e5) return sg+"₹"+(Math.round(a/1e4)/10).toLocaleString("en-IN")+" lakh";
      return sg+"₹"+Math.round(a).toLocaleString("en-IN");};
    var chg=function(v){return (v>0?"+":v<0?"−":"")+money(Math.abs(v)).replace("−","")};
    var count=function(v){return v>=1e7?(Math.round(v/1e5)/100).toLocaleString("en-IN")+" crore":(Math.round(v/1e4)/10).toLocaleString("en-IN")+" lakh"};
    var set=function(id,t){var el=$(id); if(el) el.textContent=t};
    function calc(){
      var norm=V("norm")*1e5, swap=V("swap")*1e5, eps=V("eps"), views=V("views")*1e5, sr=V("sr")/100, sfee=V("sfee"), build=V("build")*1e3, vfee=V("vfee"), fs=Math.min(V("fs"),100)/100;
      var totalViews=eps*views, swaps=totalViews*sr, swapMoney=swaps*sfee;
      var fBuild=eps*build, fView=totalViews/1000*vfee, fixed=fBuild+fView, fSwap=fs*swapMoney, pSwap=swapMoney-fSwap;
      var flam=fixed+fSwap, pub=swap-fixed+pSwap, brand=swap+swapMoney;
      set("c-ctx","Example: "+(P.cShow||"one show")+". "+count(totalViews)+" views of swap moments, "+count(swaps)+" swaps.");
      set("cw1",money(brand)); set("cw2","keeps "+money(pub)); set("cw3",money(flam));
      set("ct-bs0",money(norm)); set("ct-bs1",money(swap)); set("ct-bwl","Swap fee ("+count(swaps)+" swaps × ₹"+sfee+")"); set("ct-bw1",money(swapMoney));
      set("ct-b0",money(norm)); set("ct-b1",money(brand)); set("ct-bd",chg(brand-norm));
      set("ct-fbl","Build fee ("+eps+" moments × "+money(build)+")"); set("ct-fb1",money(fBuild));
      set("ct-fvl","View fee ("+count(totalViews)+" views × ₹"+vfee+" per 1,000)"); set("ct-fv1",money(fView));
      set("ct-fsl","Swap share, "+Math.round(fs*100)+"%"); set("ct-fs1",money(fSwap)); set("ct-f1",money(flam)); set("ct-fd",chg(flam));
      set("ct-ps0",money(norm)); set("ct-ps1",money(swap)); set("ct-pf1",money(-fixed)); set("ct-psl","Swap share, "+Math.round((1-fs)*100)+"%"); set("ct-pw1",money(pSwap));
      set("ct-p0",money(norm)); set("ct-p1",money(pub)); set("ct-pd",chg(pub-norm)); $("ct-pd").className=pub>=norm?"up":"down";
      var be=norm+fixed-pSwap;
      set("ct-be","Publisher beats the normal tier when Swap Partner is priced at "+money(Math.max(be,0))+" or more. Today it is "+money(swap)+".");
      set("cm-p",money(pub)); set("cm-p0","normal tier "+money(norm)); set("cm-px",chg(pub-norm)); $("cm-px").className="tagx num "+(pub>=norm?"good":"bad");
      set("cm-f",money(flam)); set("cm-b",money(brand)); set("cm-b0",swaps>0?money(brand/swaps)+" per swap, all-in":"");
      var o={}; IDS.forEach(function(id){o[id]=V(id)}); try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}
    }
    FlamFields.make($("calcC"),calc);
    $("c-reset").addEventListener("click",function(){IDS.forEach(function(id){FlamFields.setVal("c-"+id,DEF[id])}); calc(); toast("Back to example numbers");});
    calc();
  }

  function drawBrands(){
    if(current==="brands"){var y=window.scrollY; $("view").innerHTML=brandsPage(); window.scrollTo(0,y); return;}
    var p=byId(current), box=$("brandbox"); if(p&&box) box.innerHTML=brandBox(p);
  }
  function brandOp(p,body,msg,onErr){
    var done=function(list){p.brands=list; LAST_BRANDS=""; brandArmed=null; drawBrands(); if(msg) toast(msg+(SHARED?" · saved for everyone":""));};
    if(SHARED){ body.partner=p.id; api("POST",body).then(function(r){done(r.brands||[])},function(m){ if(onErr) onErr(m); else toast(m); }); return; }
    var list=brandsOf(p).slice(), i=list.findIndex(function(b){return b.id===body.id});
    if(body.op==="brand-add"){ if(list.some(function(b){return b.site===body.site})){ if(onErr) onErr(body.site+" is already on this list"); return; } list.push({id:"l"+Date.now().toString(36),name:body.name||siteName(body.site),site:body.site,stage:0}); }
    else if(i>=0){ if(body.op==="brand-remove") list.splice(i,1); else list[i]={id:list[i].id,name:list[i].name,stage:body.stage}; }
    var m=localBrands(); m[p.id]=list; try{localStorage.setItem(LOCAL_BRANDS_KEY,JSON.stringify(m))}catch(e){}
    done(list);
  }
  function brandClick(t){
    var p=t.dataset.bp&&byId(t.dataset.bp); if(!p) return false;
    if(t.dataset.bstage!=null){ brandOp(p,{op:"brand-stage",id:t.dataset.bid,stage:+t.dataset.bstage},BSTAGES[+t.dataset.bstage]); return true; }
    if(t.dataset.brm){ var k=p.id+"."+t.dataset.brm; if(brandArmed!==k){brandArmed=k; drawBrands(); return true;} brandOp(p,{op:"brand-remove",id:t.dataset.brm},"Removed"); return true; }
    return false;
  }
  function brandSubmit(f){
    var err=f.querySelector(".err"), pid=f.dataset.bp||(f.partner&&f.partner.value), p=pid&&byId(pid), name=f.name.value.replace(/\s+/g," ").trim(), site=cleanSite(f.site.value);
    err.textContent="";
    if(!p){err.textContent="Choose a partner."; return;}
    if(!siteOk(site)){err.textContent="Paste the brand's website, like nykaa.com. The logo comes from it."; return;}
    brandPick=f.dataset.bp?"":pid;
    brandOp(p,{op:"brand-add",site:site,name:name},"Added "+(name||siteName(site)),function(m){err.textContent=m});
  }

  /* ---------- deal stage ---------- */
  function drawDeal(){var p=byId(current), box=$("dealbox"); if(p&&box) box.innerHTML=dealFull(p);}
  function saveDeal(p,stage,note){
    note=String(note||"").replace(/\s+/g," ").trim().slice(0,140);
    var done=function(){drawDeal(); toast(STAGES[stage].t+(SHARED?" · saved for everyone":" · saved in this browser"));};
    if(SHARED){ var bs=document.querySelectorAll("#dealbox button"); bs.forEach(function(b){b.disabled=true});
      api("POST",{partner:p.id,op:"stage",stage:stage,note:note}).then(function(r){p.deal=r.deal; done();},function(m){bs.forEach(function(b){b.disabled=false}); toast(m);}); return; }
    p.deal={stage:stage,note:note}; persist(p.id,"deal"); done();
  }
  $("view").addEventListener("submit",function(e){ if(e.target.id==="cform"){ e.preventDefault(); addCase(e.target); return; } if(e.target.classList.contains("bform")){ e.preventDefault(); brandSubmit(e.target); return; } if(e.target.id!=="sform") return; e.preventDefault(); var p=byId(current); if(p) saveDeal(p,dealOf(p).stage,$("dnote").value); });

  /* ---------- shared demos (Vercel function /api/demos) ---------- */
  function api(method,body,ms){
    return new Promise(function(ok,fail){
      var ctl=window.AbortController?new AbortController():null, to=setTimeout(function(){if(ctl)ctl.abort();},ms||6000);
      fetch("api/demos",{method:method,cache:"no-store",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,signal:ctl?ctl.signal:undefined})
        .then(function(r){return r.json().catch(function(){return {}}).then(function(j){clearTimeout(to); if(r.ok) ok(j); else fail(j.error||"Couldn't save. Try again.");});})
        .catch(function(){clearTimeout(to); fail("Couldn't reach the server. Check your connection.");});
    });
  }
  function applyShared(map,stages){
    var changed=false;
    stages=stages||{};
    PARTNERS.forEach(function(p){ var st=stages[p.id]; if(st&&typeof st==="object"){ var a=JSON.stringify({stage:+st.stage||0,note:st.note||""}); if(a!==JSON.stringify(dealOf(p))){p.deal={stage:+st.stage||0,note:st.note||""}; changed=true;} } });
    PARTNERS.forEach(function(p){ if(Array.isArray(map[p.id])){ var a=JSON.stringify(map[p.id]); if(a!==JSON.stringify(p.demos||[])){p.demos=map[p.id]; changed=true;} } });
    return changed;
  }
  function loadShared(cb){
    api("GET").then(function(j){
      SHARED=true;
      PARTNERS.forEach(function(p){ if(overrides[p.id]){ delete overrides[p.id].demos; if(overrides[p.id].deal){ p.deal=JSON.parse(JSON.stringify(byIdOrig(p.id).deal||{stage:0,note:""})); delete overrides[p.id].deal; } } });
      SHARED_CASES=Array.isArray(j.cases)?j.cases:[];
      applyBrands(j.brands); LAST_BRANDS=JSON.stringify(j.brands||{});
      applyShared(j.demos||{},j.stages); cb();
    },function(){ SHARED=false; applyBrands(localBrands()); cb(); });
  }
  var syncing=false;
  function syncShared(){
    if(!SHARED||syncing) return; syncing=true;
    api("GET").then(function(j){ syncing=false;
      var nc=Array.isArray(j.cases)?j.cases:[]; if(JSON.stringify(nc)!==JSON.stringify(SHARED_CASES)){ SHARED_CASES=nc; var ae=document.activeElement; if(current==="cases"&&!(ae&&ae.closest&&ae.closest("#cform"))&&!caseState.armed) drawCases(); }
      var bj=JSON.stringify(j.brands||{}); if(bj!==LAST_BRANDS){ LAST_BRANDS=bj; var be=document.activeElement, busy=(be&&be.closest&&be.closest(".bform"))||brandArmed; if(!busy){ applyBrands(j.brands); if(byId(current)||current==="brands") drawBrands(); else if(current==="overview") rerender(); } else LAST_BRANDS=""; }
      if(applyShared(j.demos||{},j.stages)){ if(byId(current)){ if((demoState[current]||{}).edit==null) rerenderDemo(); if(!document.activeElement||document.activeElement.id!=="dnote") drawDeal(); } else if(current==="demos"||current==="overview") rerender(); } },function(){syncing=false;});
  }
  window.addEventListener("hashchange",function(){setTimeout(syncShared,50)});
  window.addEventListener("focus",syncShared);
  setInterval(function(){ if(!document.hidden) syncShared(); },30000);
  loadShared(function(){checkLogos(route)});
})();
</script>
</body>
